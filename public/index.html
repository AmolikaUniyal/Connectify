<!DOCTYPE html>
<html>
<head>
  <title>Connectify Chat</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; 
    }

    .chat-container {
      width: 400px;
      height: 600px;
      background: #1e293b;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .chat-header {
      padding: 15px;
      background: #334155;
      color: white;
      font-weight: bold;
      text-align: center;
    }

    #messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 70%;
      word-wrap: break-word;
    }

    .me {
      background: #22c55e;
      align-self: flex-end;
      color: white;
    }

    .other {
      background: #475569;
      align-self: flex-start;
      color: white;
    }

    .chat-input {
      display: flex;
      padding: 10px;
      background: #334155;
    }

    #status {
      min-height: 18px;
      padding: 0 15px 8px;
      background: #334155;
      color: #fecaca;
      font-size: 12px;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    button {
      margin-left: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }
    .hidden { display: none !important; }
    .legacy { display: none; }
    #auth-panel, #chat-panel { width: min(94vw, 720px); background: #1e293b; border-radius: 14px; overflow: hidden; box-shadow: 0 18px 45px rgba(0,0,0,.35); }
    #auth-panel { width: min(94vw, 420px); padding: 28px; color: #e2e8f0; }
    #auth-panel h1 { margin-top: 0; } #auth-panel form { display: grid; gap: 12px; } #auth-panel input, #room { width: 100%; padding: 10px; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: white; }
    .secondary, .logout { background: transparent; color: #86efac; padding: 8px; } .logout { color: #fecaca; }
    #chat-panel .chat-header { display: flex; align-items: center; justify-content: space-between; } #chat-panel .chat-header h1 { margin: 0; font-size: 20px; }
    .room-bar { display: flex; gap: 10px; padding: 10px; background: #334155; } .room-bar button { margin-left: 0; }
    #presence { min-height: 20px; padding: 7px 15px; background: #334155; color: #cbd5e1; font-size: 13px; } #status.error { color: #fecaca; }
    #chat-panel #messages { height: 430px; } #chat-panel .message { background: #475569; } #chat-panel .message.me { background: #15803d; align-self: flex-end; } .meta { display: block; margin-bottom: 4px; font-size: 11px; color: #cbd5e1; }
  </style>
</head>

<body>

  <section id="auth-panel">
    <h1>Connectify</h1><p>Secure real-time chat system</p>
    <form id="login-form"><input id="login-email" type="email" placeholder="Email" required /><input id="login-password" type="password" placeholder="Password" required /><button type="submit">Log in</button></form>
    <button id="show-signup" class="secondary" type="button">New here? Create an account</button>
    <form id="signup-form" class="hidden"><input id="signup-username" placeholder="Username (3–30 characters)" required /><input id="signup-email" type="email" placeholder="Email" required /><input id="signup-password" type="password" minlength="6" placeholder="Password (minimum 6 characters)" required /><button type="submit">Create account</button></form>
    <div id="auth-status" role="status" aria-live="polite"></div>
  </section>
  <main id="chat-panel" class="hidden">
    <header class="chat-header"><h1>Connectify</h1><span id="current-user"></span><button id="logout" class="logout">Log out</button></header>
    <div class="room-bar"><select id="room"><option value="general">General</option><option value="study">Study</option><option value="technology">Technology</option></select><button id="join-room">Join room</button></div>
    <div id="presence"></div><div id="status" role="status" aria-live="polite"></div><div id="messages" aria-live="polite"></div>
    <form id="message-form" class="chat-input"><input id="message-input" maxlength="1000" placeholder="Type a message..." autocomplete="off" required /><button>Send</button></form>
  </main>

  <div class="chat-container legacy">
    <div class="chat-header">💬 Connectify</div>

    <div id="messages"></div>

    <div class="chat-input">
      <input id="messageInput" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <!-- socket -->
  <script src="/socket.io/socket.io.js"></script>

  <script>
    if (false) {
    const socket = io();
    const messagesDiv = document.getElementById("messages");
    const statusDiv = document.getElementById("status");

    function sendMessage() {
      const input = document.getElementById("messageInput");
      const message = input.value.trim();

      if (!message) return;

      socket.emit("sendMessage", message);
    }

    socket.on("messageAccepted", ({ message }) => {
      const input = document.getElementById("messageInput");
      addMessage(message, "me");
      input.value = "";
      statusDiv.textContent = "";
    });

    socket.on("messageBlocked", ({ reason }) => {
      statusDiv.textContent = reason;
    });

    socket.on("receiveMessage", (msg) => {
      addMessage(msg, "other");
    });

    function addMessage(msg, type) {
      const div = document.createElement("div");
      div.classList.add("message", type);
      div.textContent = msg;

      messagesDiv.appendChild(div);

      // auto scroll
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    }
  </script>
  <script src="/client.js"></script>

</body>
</html>
